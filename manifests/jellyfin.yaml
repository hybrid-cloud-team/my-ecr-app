apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # --- 노드 그룹 고정 설정 ---
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      
      containers:
      - name: jellyfin
        # 아래 image 주소는 GitHub Action에 의해 자동으로 업데이트됩니다.
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:latest 
        ports:
        - containerPort: 8096
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80      # 외부에서 접속할 포트
    targetPort: 8096  # 컨테이너 내부 포트
  type: LoadBalancer  # EKS에서 외부 접속을 위해 필요
