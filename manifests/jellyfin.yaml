apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  # [유지] 초기화 충돌 방지를 위해 1개로 시작
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        # 이미지 태그는 GitHub Action에 의해 자동으로 업데이트됩니다.
        image: 635014547592.dkr.ecr.us-east-1.amazonaws.com/jellyfin:06401d5960830518ac561843e5ad8193a972358a
        imagePullPolicy: Always
        ports:
        - containerPort: 8096

        # [유지] /config 경로를 빈 볼륨으로 덮어씌움
        volumeMounts:
        - name: clean-config-vol
          mountPath: /config

        # --- [핵심] RDS 연결 설정 (순서 중요) ---
        env:
          # 1. 재료가 되는 변수들을 먼저 정의합니다.
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_HOST
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rds-secret
                key: DB_PASSWORD
          
          # 2. DB 타입을 MySQL로 강제 지정
          - name: JELLYFIN_Database__Type
            value: "MySql"

          # 3. [필살기] 위 변수들을 조합해 완성된 연결 문자열을 직접 주입
          # SslMode=None을 추가하여 인증서 오류를 방지합니다.
          - name: JELLYFIN_ConnectionStrings__JellyfinDb
            value: "Server=$(DB_HOST);Database=$(DB_NAME);User=$(DB_USER);Password=$(DB_PASSWORD);SslMode=None;"
        # --- 여기까지 ---
        
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15

      # [유지] 빈 볼륨 생성
      volumes:
      - name: clean-config-vol
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8096
  type: ClusterIP
