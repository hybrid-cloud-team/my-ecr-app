apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 2  # ✅ 이제 2개 이상으로 늘려도 안전합니다!
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      
      # ✅ [1. 초기화 컨테이너 추가] 파드 시작 전 DB 복사 작업 수행
      initContainers:
      - name: init-config-loader
        image: 635014547592.dkr.ecr.us-east-1.amazonaws.com/jellyfin:af276e484b3a12bf995afe777723cf8c3d7a074a
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Initializing config..."
            # EFS(원본)에서 파드 내부(임시공간)로 설정 파일 복사
            if [ "$(ls -A /mnt/source)" ]; then
              cp -a /mnt/source/. /config/
              echo "Config copied from EFS."
            else
              echo "Warning: Source is empty. Starting fresh."
            fi
            # 권한 강제 설정 (젤리핀 UID: 1000)
            chown -R 1000:1000 /config
        volumeMounts:
        - name: jellyfin-config-efs  # 원본 (EFS)
          mountPath: /mnt/source     # 여기는 읽기 전용으로 씀
        - name: jellyfin-config-local # 복사본 (임시공간)
          mountPath: /config

      containers:
      - name: jellyfin
        image: 635014547592.dkr.ecr.us-east-1.amazonaws.com/jellyfin:af276e484b3a12bf995afe777723cf8c3d7a074a
        imagePullPolicy: Always
        ports:
        - containerPort: 8096
        
        # ✅ [2. 볼륨 마운트 변경] EFS 직접 연결 끊고 임시 공간 사용
        volumeMounts:
        - name: jellyfin-config-local  # ⚠️ 중요: EFS가 아닌 복사된 임시공간을 바라봄
          mountPath: /config
        - name: jellyfin-media
          mountPath: /media
        - name: jellyfin-cache
          mountPath: /config/cache
        - name: jellyfin-transcodes
          mountPath: /config/transcodes

        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15

      volumes:
      # ✅ [3. 볼륨 정의]
      - name: jellyfin-media
        persistentVolumeClaim:
          claimName: jellyfin-media-pvc

      - name: jellyfin-config-efs # 원본 데이터 (EFS)
        persistentVolumeClaim:
          claimName: jellyfin-config-efs

      - name: jellyfin-config-local # 각 파드가 쓸 임시 공간 (여기에 복사됨)
        emptyDir: {}

      - name: jellyfin-cache
        emptyDir: {}
        
      - name: jellyfin-transcodes
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  # LoadBalancer 사용 시 필요하면 주석 해제
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: jellyfin
  # ✅ [4. 세션 고정 추가] 로그인 풀림 방지 (필수!)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800 # 3시간
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8096
  type: ClusterIP
