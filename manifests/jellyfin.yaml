apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin 
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # 특정 노드 그룹에 배치 (eks-app-node)
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      
      initContainers:
      - name: download-movie
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:276c0a2a8ace0096606dc1cb292407c2fdc62072
        command: ["sh", "-c"]
        args:
          - |
            echo "영화 다운로드 중..."
            mkdir -p /media/movies/BigBuckBunny
            if [ ! -f /media/movies/BigBuckBunny/movie.mp4 ]; then
              wget -O /media/movies/BigBuckBunny/movie.mp4 https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_5MB.mp4
            fi
            echo "다운로드 완료!"
        volumeMounts:
        - name: media-data
          mountPath: /media
          
      containers:
      - name: jellyfin
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:276c0a2a8ace0096606dc1cb292407c2fdc62072
        ports:
        - containerPort: 8096
        volumeMounts:
        - name: config-data
          mountPath: /config
        - name: media-data
          mountPath: /media
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi" 
            cpu: "1000m"
            
      volumes:
      - name: config-data
        emptyDir: {}
      - name: media-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  annotations:
    # [수정] 외부 접속이 가능하도록 Internet-facing 설정 추가
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # (선택사항) NLB를 사용하고 싶다면 아래 주석 추가
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8096
    protocol: TCP
  selector:
    app: jellyfin
