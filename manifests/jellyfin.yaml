apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  # 파드 교체 전략: 기존 파드를 먼저 죽여서 자리를 확보하도록 설정
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # 파드를 특정 노드(eks-app-node)에 배치
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        # 이 이미지 태그는 GitHub Action이 최신 SHA 값으로 자동 교체합니다.
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:11bb39b97b7998dd6659ac0c9bb91898509d42bb
        ports:
        - containerPort: 8096
          name: http
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8096"
        # Pending을 해결하기 위해 리소스 예약량을 현실적으로 낮췄습니다.
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8096
  type: LoadBalancer
