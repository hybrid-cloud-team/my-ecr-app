apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate # 기존 꼬인 파드를 확실히 제거
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:72065ff1a591df83592c6b2f6879ce1bfb390a89
        ports:
        - containerPort: 8096
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8096"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8096
  type: LoadBalancer
