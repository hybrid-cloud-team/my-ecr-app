apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 2
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        # 이미지 태그는 GitHub Action에 의해 자동으로 업데이트됩니다.
        image: 635014547592.dkr.ecr.us-east-1.amazonaws.com/jellyfin:6a70951f7135d82712b1c2ade46fd1dc90d29933
        # imagePullPolicy: Always
        ports:
        - containerPort: 8096
        volumeMounts:
        - name: jellyfin-config
          mountPath: /config
        - name: jellyfin-media
          mountPath: /media
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15
      volumes:
      - name: jellyfin-config
        persistentVolumeClaim:
          claimName: jellyfin-config-efs
      - name: jellyfin-media
        persistentVolumeClaim:
          claimName: jellyfin-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  annotations:
    # [핵심] 로드밸런서를 인터넷 접속용으로 생성하게 합니다.
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80         # 브라우저 접속 포트
    targetPort: 8096 # 젤리핀 서버 포트
  type: ClusterIP