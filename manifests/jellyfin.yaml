apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        # 이미지 태그는 GitHub Action에 의해 자동으로 업데이트됩니다.
        image: 635014547592.dkr.ecr.us-east-1.amazonaws.com/jellyfin:61430aeddab38725a9d53a12f8d5c7f0c0cb22ea
        imagePullPolicy: Always
        
        # ❌ [삭제] 이 args 부분이 문제였습니다! 지워주세요!
        # args:
        #   - "--Database:Type=MySql"

        ports:
        - containerPort: 8096

        volumeMounts:
        - name: clean-config-vol
          mountPath: /config

        env:
          # ✅ [추가] args 대신 환경변수로 넣어야 서버가 죽지 않고 인식합니다.
          - name: JELLYFIN_Database__Type
            value: "MySql"
            
          # [유지] 재료 변수들
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_HOST
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rds-secret
                key: DB_PASSWORD
          
          # [유지] 완성된 연결 문자열
          - name: JELLYFIN_ConnectionStrings__JellyfinDb
            value: "Server=$(DB_HOST);Database=$(DB_NAME);User=$(DB_USER);Password=$(DB_PASSWORD);SslMode=None"

        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15

      volumes:
      - name: clean-config-vol
        emptyDir: {}
