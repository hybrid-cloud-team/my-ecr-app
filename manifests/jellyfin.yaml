apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:325f43fa2a2c08a0b6ba0d21f81ef4296c7cc3f4
        ports:
        - containerPort: 8096
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80         # 로드밸런서 주소로 들어오는 포트
    targetPort: 8096 # 컨테이너 내부 포트
    # [수정] 노드포트를 32096으로 강제 지정하여 통로를 확실히 뚫습니다.
    nodePort: 32096  
  type: LoadBalancer
