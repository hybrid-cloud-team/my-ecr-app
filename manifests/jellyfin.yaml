apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        # 이미지 태그는 GitHub Action에 의해 자동으로 업데이트됩니다.
        image: 635014547592.dkr.ecr.us-east-1.amazonaws.com/jellyfin:549d6bc2cb06154b8e78c55282935eeca2b795bb
        imagePullPolicy: Always
        
        # [핵심 추가] 이 한 줄이 젤리핀을 강제로 MySQL 모드로 전환합니다.
        args:
          - "--Database:Type=MySql"

        ports:
        - containerPort: 8096

        volumeMounts:
        - name: clean-config-vol
          mountPath: /config

        env:
          # [유지] 재료 변수들
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_HOST
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rds-secret
                key: DB_PASSWORD
          
          # [유지] 완성된 연결 문자열 (이건 잘 작동했습니다)
          - name: JELLYFIN_ConnectionStrings__JellyfinDb
            value: "Server=$(DB_HOST);Database=$(DB_NAME);User=$(DB_USER);Password=$(DB_PASSWORD);SslMode=None"
            # (끝에 세미콜론 제거함: 더 안전함)

        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15

      volumes:
      - name: clean-config-vol
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8096
  type: ClusterIP
