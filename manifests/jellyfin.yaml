apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  # [수정] 초기화 충돌 방지를 위해 1개로 시작 (성공 후 나중에 2개로 늘리세요)
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        # 이미지 태그는 GitHub Action에 의해 자동으로 업데이트됩니다.
        image: 635014547592.dkr.ecr.us-east-1.amazonaws.com/jellyfin:f8dbbf220d2b00c54ac390adc2c70734d4db807a
        imagePullPolicy: Always
        ports:
        - containerPort: 8096

        # [유지] /config 경로를 빈 볼륨으로 덮어씌워서 초기화 상태로 만듦
        volumeMounts:
        - name: clean-config-vol
          mountPath: /config

        # --- 여기서부터 RDS 환경 변수 ---
        env:
          # [신규 추가] 젤리핀에게 DB Provider가 MySQL임을 강제로 지정
          - name: JELLYFIN_Database__Type
            value: "MySql"
            
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_HOST
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: rds-config
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rds-secret
                key: DB_PASSWORD
        # --- 여기까지 추가 ---
        
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15

      # [유지] 파드가 생성될 때마다 깨끗한 빈 볼륨 생성
      volumes:
      - name: clean-config-vol
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8096
  type: ClusterIP
