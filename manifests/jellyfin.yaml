apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin 
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # -------------------------------------------------------
      # [핵심 수정] eks-app-node 노드 그룹에만 Pod를 배치합니다.
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      # -------------------------------------------------------
      initContainers:
      - name: download-movie
        image: busybox
        command: ["sh", "-c"]
        args:
          - |
            echo "영화 다운로드 중..."
            mkdir -p /media/movies/BigBuckBunny
            if [ ! -f /media/movies/BigBuckBunny/movie.mp4 ]; then
              wget -O /media/movies/BigBuckBunny/movie.mp4 https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_5MB.mp4
            fi
            echo "다운로드 완료!"
        volumeMounts:
        - name: media-data
          mountPath: /media
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        ports:
        - containerPort: 8096
        volumeMounts:
        - name: config-data
          mountPath: /config
        - name: media-data
          mountPath: /media
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi" 
            cpu: "1000m"
      volumes:
      - name: config-data
        emptyDir: {}
      - name: media-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8096
    protocol: TCP
  selector:
    app: jellyfin
