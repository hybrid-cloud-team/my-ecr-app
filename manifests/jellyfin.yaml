apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate # 기존에 꼬인 파드를 완전히 삭제 후 새로 생성 (자원 확보용)
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # [필수] 지정하신 eks-app-node 노드 그룹으로 배정
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        # 이미지 주소는 GitHub Action에 의해 최신 태그로 자동 교체됩니다.
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:d097c69e42c31b7c749b05cd7a881097f0c8c0f5
        ports:
        - containerPort: 8096
          name: http
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8096"
        # Pending 문제를 해결하기 위해 리소스 예약량을 최소화(최종)
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8096
  type: LoadBalancer
