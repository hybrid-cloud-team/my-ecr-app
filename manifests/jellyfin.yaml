apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:3f1280baffab603d22a413eb5dd3a8c6daf4094e
        ports:
        - containerPort: 8096
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 8096       # [수정] 외부 접속 포트를 8096으로 변경
    targetPort: 8096 # 컨테이너 포트 8096
  type: LoadBalancer
