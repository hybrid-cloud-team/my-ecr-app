apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # 파드를 eks-app-node 노드에 배치
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      
      containers:
      - name: jellyfin
        # 아래 주소는 GitHub Action에 의해 자동 업데이트됨
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:8a4386d426a5ff99552db5a15aef0e1d0d7c7e26
        ports:
        - containerPort: 8096
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8096
  type: LoadBalancer
