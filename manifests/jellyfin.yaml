apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 2
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        image: 635014547592.dkr.ecr.us-east-1.amazonaws.com/jellyfin:a1488270f87e2d3d15de9c9ba777c47dee48cb6a
        imagePullPolicy: Always
        ports:
        - containerPort: 8096
        volumeMounts:
        - name: jellyfin-config
          mountPath: /config
        - name: jellyfin-media
          mountPath: /media
        
        # [추가] 쓰기 작업이 많은 캐시와 트랜스코딩은 EFS가 아닌 임시 볼륨 사용
        # 이렇게 하면 SQLite가 있는 /config 루트의 부하가 줄어듭니다.
        - name: jellyfin-cache
          mountPath: /config/cache
        - name: jellyfin-transcodes
          mountPath: /config/transcodes

        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15
      volumes:
      - name: jellyfin-config
        persistentVolumeClaim:
          claimName: jellyfin-config-efs
      - name: jellyfin-media
        persistentVolumeClaim:
          claimName: jellyfin-media-pvc
      
      # [추가] 파드가 죽으면 날아가도 되는 데이터는 emptyDir 사용 (RAM/Node Disk)
      - name: jellyfin-cache
        emptyDir: {}
      - name: jellyfin-transcodes
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  # ClusterIP 서비스에는 LB 관련 annotation이 필요 없습니다. (Ingress에서 처리)
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8096
  type: ClusterIP
