apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  revisionHistoryLimit: 1  # 구버전 RS 기록을 1개만 남기고 자동 삭제
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        # GitHub Action이 빌드한 최신 이미지를 사용
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:325f43fa2a2c08a0b6ba0d21f81ef4296c7cc3f4
        ports:
        - containerPort: 8096
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        # 가장 확실한 상태 체크 방식 (포트가 열려있는지 확인)
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80         # 브라우저 접속용 (http://주소)
    targetPort: 8096 # 컨테이너 내부 포트
  type: LoadBalancer
