apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin 
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # 특정 노드 그룹에 배치
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      
      initContainers:
      - name: download-movie
        # [수정] 충돌 방지를 위해 무거운 .NET 이미지 대신 가벼운 alpine 사용
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:8a29bad434a55fa173999c1e4db22234211ee445
        command: ["sh", "-c"]
        args:
          - |
            echo "영화 다운로드 중..."
            mkdir -p /media/movies/BigBuckBunny
            # alpine 환경에 맞춰 wget 실행 (기본 내장됨)
            if [ ! -f /media/movies/BigBuckBunny/movie.mp4 ]; then
              wget -O /media/movies/BigBuckBunny/movie.mp4 https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_5MB.mp4
            fi
            echo "다운로드 완료!"
        volumeMounts:
        - name: media-data
          mountPath: /media
          
      containers:
      - name: jellyfin
        # 이 부분은 GitHub Actions가 빌드 시 자동으로 최신 태그로 업데이트합니다.
        image: 635014547592.dkr.ecr.ap-northeast-2.amazonaws.com/my-ecr-app:8a29bad434a55fa173999c1e4db22234211ee445
        ports:
        - containerPort: 8096
        volumeMounts:
        - name: config-data
          mountPath: /config
        - name: media-data
          mountPath: /media
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi" 
            cpu: "1000m"
            
      volumes:
      - name: config-data
        emptyDir: {}
      - name: media-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  annotations:
    # 외부 접속용 로드밸런서 설정
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8096
    protocol: TCP
  selector:
    app: jellyfin
