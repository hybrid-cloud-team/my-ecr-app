apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 2
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: eks-app-node
      containers:
      - name: jellyfin
        # ⚠️ 중요: 이 이미지는 구버전(10.7.x 기반)일 가능성이 높습니다. 
        # 최신 버전(10.9+)의 config 파일을 마운트하면 충돌날 수 있으니 주의하세요.
        image: 635014547592.dkr.ecr.us-east-1.amazonaws.com/jellyfin:1156a9bcde81f07f23f0f9c8ffa8857b0232ea9e
        imagePullPolicy: Always
        
        # ✅ [여기부터 추가] DB 연결 설정 시작
        env:
        # 1. DB 종류를 PostgreSQL로 강제 지정
        - name: JELLYFIN_Database__Provider
          value: "PostgreSQL"
          
        # 2. AWS RDS 연결 정보 입력 (아래 3곳을 실제 값으로 수정하세요)
        # Server: AWS RDS 엔드포인트 주소
        # User Id: 마스터 사용자 ID (예: jellyfin)
        # Password: 마스터 비밀번호
        - name: JELLYFIN_ConnectionStrings__DefaultConnection
          value: "Server=jellyfin-database-1.c8bacacucmpz.us-east-1.rds.amazonaws.com;Port=5432;Database=jellyfin;User Id=jellyfin;Password=12345678;"
          
        # 3. 최초 실행 시 테이블 생성 (마이그레이션) 허용
        - name: JELLYFIN_RunMigrations
          value: "true"
        # ✅ [여기까지 추가] DB 연결 설정 끝

        ports:
        - containerPort: 8096
        
        volumeMounts:
        - name: jellyfin-config
          mountPath: /config
        - name: jellyfin-media
          mountPath: /media
        
        # [성능 최적화] 임시 볼륨 사용 (잘 하셨습니다!)
        - name: jellyfin-cache
          mountPath: /config/cache
        - name: jellyfin-transcodes
          mountPath: /config/transcodes

        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        startupProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 15
      volumes:
      - name: jellyfin-config
        persistentVolumeClaim:
          # ⚠️ 주의: 기존 SQLite 설정파일이 남아있으면 충돌날 수 있습니다.
          # 문제가 생기면 PVC를 비우거나 새 PVC를 연결하는 것을 권장합니다.
          claimName: jellyfin-config-efs
      - name: jellyfin-media
        persistentVolumeClaim:
          claimName: jellyfin-media-pvc
      
      # 캐시/트랜스코딩용 임시 디스크
      - name: jellyfin-cache
        emptyDir: {}
      - name: jellyfin-transcodes
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8096
  type: ClusterIP
