apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-tester
  namespace: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rds-tester
  template:
    metadata:
      labels:
        app: rds-tester
    spec:
      containers:
      - name: tester
        image: mysql:5.7
        env:
          - name: DB_HOST
            valueFrom: { configMapKeyRef: { name: rds-config, key: DB_HOST } }
          - name: DB_USER
            valueFrom: { configMapKeyRef: { name: rds-config, key: DB_USER } }
          - name: DB_PASSWORD
            valueFrom: { secretKeyRef: { name: rds-secret, key: DB_PASSWORD } }
        command: ["/bin/sh", "-c"]
        args:
          - |
            mysql -h $(DB_HOST) -u $(DB_USER) -p$(DB_PASSWORD) -e "CREATE DATABASE IF NOT EXISTS jellyfin; USE jellyfin; CREATE TABLE IF NOT EXISTS connection_success (id INT AUTO_INCREMENT PRIMARY KEY, test_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP); INSERT INTO connection_success () VALUES ();"
            echo "RDS Connection Success!"
            sleep 3600
