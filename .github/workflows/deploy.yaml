name: Build and Deploy to EKS

on:
  push:
    branches: [ "main" ]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-ecr-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 캐시 없이 깨끗하게 빌드하는 것을 권장 (파일 누락 방지)
          docker build --no-cache -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Kubernetes resources
        run: |
          # 1. 이미지 태그 업데이트 (이미지 주소 전체를 정확히 매칭해서 교체)
          sed -i "s|image: .*|image: ${{ steps.build-image.outputs.image }}|g" manifests/jellyfin.yaml
          
          # 2. Git 커밋 및 푸시
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add manifests/jellyfin.yaml
          
          # [중요] 변경사항이 있을 때만 커밋 (에러 방지)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update image tag to ${{ github.sha }} [skip ci]" && git push)
