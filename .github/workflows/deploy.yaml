name: Build and Deploy to EKS

on:
  push:
    branches: [ "main" ]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 전체 히스토리를 가져와서 rebase 충돌 방지

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-ecr-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Kubernetes resources
        run: |
          # Git 설정
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 1. 최신 상태를 가져오기 (rebase로 히스토리 정렬)
          git pull origin main --rebase

          # 2. 이미지 태그 업데이트
          sed -i "s|image: .*|image: ${{ steps.build-image.outputs.image }}|g" manifests/jellyfin.yaml
          
          # 3. 변경사항이 있는 경우에만 커밋 및 푸시
          git add manifests/jellyfin.yaml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update image tag to ${{ github.sha }} [skip ci]"
            # 푸시 실패 시 한 번 더 최신화 후 시도
            git push origin main || (git pull origin main --rebase && git push origin main)
          else
            echo "No changes to commit"
          fi
