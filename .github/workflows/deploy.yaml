name: Build and Update GitOps Repo

on:
  push:
    branches: ["main"]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # ✅ OIDC 필수

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: jellyfin
      IMAGE_TAG: ${{ github.sha }}

      DEPLOY_REPO: hybrid-cloud-team/jellyfin-deploy
      DEPLOY_BRANCH: main
      MANIFEST_PATH: manifests/jellyfin.yaml

    steps:
      - name: Checkout app source repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC AssumeRole)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635014547592:role/github-actions-ecr-jellyfin
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: ${{ env.DEPLOY_BRANCH }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy-repo

      - name: Update image tag in deploy repo
        run: |
          cd deploy-repo
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          sed -i "s|image: .*|image: ${{ steps.build-image.outputs.image }}|g" "${MANIFEST_PATH}"

          git add "${MANIFEST_PATH}"
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update jellyfin image to ${{ github.sha }}"
            git push origin "${DEPLOY_BRANCH}"
          else
            echo "No changes to commit"
          fi
