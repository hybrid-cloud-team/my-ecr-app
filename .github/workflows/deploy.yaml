name: Build and Deploy to EKS

on:
  push:
    branches: [ "main" ]  # main 브랜치에 코드가 push될 때 트리거

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. AWS 자격 증명 설정 (GitHub Secrets에 미리 등록 필요)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 2. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 3. Docker 이미지 빌드 및 ECR 푸시
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-ecr-app
          IMAGE_TAG: ${{ github.sha }} # 커밋 해시값을 태그로 사용 (버전 관리)
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 4. Manifest 파일 수정 (Argo CD가 감지할 수 있도록 이미지 태그 변경)
      - name: Update Kubernetes resources
        run: |
          # manifests/jellyfin.yaml 내의 이미지 정보를 새 태그로 교체
          sed -i "s|image: jellyfin/jellyfin:latest|image: ${{ steps.login-ecr.outputs.registry }}/<레포지토리이름>:${{ github.sha }}|g" manifests/jellyfin.yaml
          
          # 변경사항을 GitHub에 다시 커밋하여 반영
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add manifests/jellyfin.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push
