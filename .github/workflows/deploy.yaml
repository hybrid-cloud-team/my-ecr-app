name: Build and Update GitOps Repo

on:
  push:
    branches: ["main"]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: jellyfin
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_REPO: hybrid-cloud-team/my-ecr-app
      DEPLOY_BRANCH: main
      MANIFEST_PATH: manifests/jellyfin.yaml

    steps:
      - name: Checkout app source repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635014547592:role/github-actions-ecr-jellyfin
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # [핵심] 빌드 시 캐시를 완전히 제거하여 수정된 C# 코드가 반드시 반영되게 함
          docker build --no-cache -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: hybrid-cloud-team

      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: ${{ env.DEPLOY_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          path: deploy-repo

      - name: Update image tag in deploy repo
        run: |
          cd deploy-repo
          git config user.email "action@github.com"
          git config user.name "GitOps Bot"

          # 매니페스트의 이미지를 새 해시로 교체
          sed -i "s|image: .*|image: ${{ steps.build-image.outputs.image }}|g" "${MANIFEST_PATH}"
          
          # [중요] Always 설정이 없으면 추가하여 EKS가 새 이미지를 강제로 받게 함
          if ! grep -q "imagePullPolicy" "${MANIFEST_PATH}"; then
            sed -i "/image: /a \        imagePullPolicy: Always" "${MANIFEST_PATH}"
          fi

          git add "${MANIFEST_PATH}"
          # [무한루프방지] 커밋 메시지에 [skip ci] 추가
          git commit -m "Update jellyfin image to ${{ github.sha }} [skip ci]" || echo "No changes"
          git push origin "${DEPLOY_BRANCH}"
